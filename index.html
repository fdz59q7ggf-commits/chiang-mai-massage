<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清邁按摩總圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#faf7f2;--paper:#fff;--ink:#2b2622;--muted:#7a6f66;--line:#e8e0d6;--accent:#c8553d;--accent-dim:#f7e3dd;
  --t1:#2e8b57;--t2:#3a7bd5;--t3:#8e44ad;--t4:#c8553d;--home:#222;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1917;--paper:#262320;--ink:#eee6dd;--muted:#a89d92;--line:#3a3530;--accent:#e9785f;--accent-dim:#3a2621;--home:#eee;}}
:root[data-theme="dark"]{--bg:#1b1917;--paper:#262320;--ink:#eee6dd;--muted:#a89d92;--line:#3a3530;--accent:#e9785f;--accent-dim:#3a2621;--home:#eee;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
header{padding:16px;max-width:1200px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:1fr 380px;gap:16px}
#map,#gmap{height:calc(100vh - 210px);min-height:420px;border-radius:12px;border:1px solid var(--line)}
#gmap{display:none;width:100%;background:var(--paper)}
.mapside{display:flex;flex-direction:column;gap:8px}
.views{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.views .note{font-size:12px;color:var(--muted)}
.list{height:calc(100vh - 170px);min-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.card:hover,.card.sel{border-color:var(--accent)}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:6px}
.num{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.en{color:var(--muted);font-size:12px;margin:0 0 6px}
.meta{font-size:13px;line-height:1.55}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;background:var(--accent-dim);color:var(--accent);margin-right:4px}
.links{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.links a{font-size:12px;font-weight:600;text-decoration:none;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.trip{font-size:12px;color:var(--t1);margin-top:4px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.leaflet-popup-content a{color:#c8553d;font-weight:600}
/* 給司機看 */
.links a.drv,.links button.drv{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#driver{position:fixed;inset:0;z-index:2000;background:var(--bg);display:none;flex-direction:column;overflow:auto}
#driver.open{display:flex}
#driver .dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#driver .dhead button{font-size:16px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#driver .dbody{padding:16px;max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#driver .please{font-size:22px;color:var(--muted)}
#driver .thname{font-size:clamp(30px,7vw,52px);font-weight:800;line-height:1.25}
#driver .thnear{font-size:clamp(22px,5vw,32px);color:var(--accent);font-weight:700}
#driver .thaddr{font-size:clamp(18px,4vw,24px);line-height:1.5}
#driver .zh{font-size:14px;color:var(--muted)}
#driver iframe{width:100%;height:50vh;min-height:300px;border:1px solid var(--line);border-radius:12px}
#driver .big{display:block;text-align:center;font-size:20px;font-weight:700;text-decoration:none;color:#fff;background:var(--accent);border-radius:12px;padding:14px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}#map,#gmap{height:55vh}.list{height:auto}}
</style>
</head>
<body>
<header>
  <h1>🗺️ 清邁按摩總圖</h1>
  <p class="sub">6 人清邁行程 2026/11/11–11/18 · 標記為概略位置，精確位置請點「Google 地圖」 · 價格以現場為準</p>
  <div class="filters" id="areaF"></div>
  <div class="filters" id="tierF"></div>
  <div class="legend" id="legend"></div>
</header>
<div class="wrap">
  <div class="mapside">
    <div class="views" id="views">
      <button class="chip on" data-view="all">🗺️ 總圖（英文街名）</button>
      <button class="chip" data-view="google">📍 Google 地圖（英文）</button>
      <span class="note" id="gnote">點清單或標記，切到 Google 地圖看該店周邊</span>
    </div>
    <div id="map"></div>
    <iframe id="gmap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Google 地圖"></iframe>
  </div>
  <div class="list" id="list"></div>
</div>
<div id="driver" role="dialog" aria-modal="true">
  <div class="dhead"><b>🛺 給司機看</b><button onclick="closeDriver()">關閉 ✕</button></div>
  <div class="dbody">
    <div class="please">กรุณาไปส่งที่นี่ครับ/ค่ะ 🙏</div>
    <div class="thname" id="dName"></div>
    <div class="thnear" id="dNear"></div>
    <div class="thaddr" id="dAddr"></div>
    <div class="zh" id="dZh"></div>
    <iframe id="dMap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่"></iframe>
    <a class="big" id="dOpen" target="_blank" rel="noopener">เปิดใน Google Maps（泰文導航）</a>
  </div>
</div>

", "klook": "", "lat": 18.8009, "lng": 98.9676, "desc": "營業到凌晨1點，晚上逛完寧曼最晚還能按的店。", "trip": "", "name_th": "โคซี่ มาสสาจ แอนด์ สปา (นิมมาน 15)", "addr_th": "2/3 ถนนนิมมานเหมินท์ ซอย 15 ต.สุเทพ อ.เมืองเชียงใหม่ จ.เชียงใหม่ 50200", "near_th": "นิมมาน ซอย 15", "gmap": "https://www.google.com/maps/search/?api=1&query=Cozy%20Massage%20and%20Spa%20%28Nimman%2015%29%202/3%20Nimmanhaemin%20Rd%20%28Soi%2015%29%2C%20Su%20Thep%2C%20Mueang%20Chiang%20Mai%2050200&hl=en", "gmap_th": "https://www.google.com/maps/search/?api=1&query=Cozy%20Massage%20and%20Spa%20%28Nimman%2015%29%202/3%20Nimmanhaemin%20Rd%20%28Soi%2015%29%2C%20Su%20Thep%2C%20Mueang%20Chiang%20Mai%2050200&hl=th"}, {"id": "varalee", "name": "Varalee Massage (Sirimangkalajarn)", "zh": "Varalee 按摩", "area": "寧曼", "tier": "平價", "addr": "Sirimangkalajarn Rd（寧曼西側平行路）, Su Thep, Mueang Chiang Mai 50200", "hours": "約10:00-24:00", "price": "泰式60分約300銖起", "phone": "", "klook": "https://www.klook.com/activity/153132-varalee-massage-experience-in-chiang-mai/", "lat": 18.7985, "lng": 98.9655, "desc": "Klook 可訂的平價按摩，營業到很晚。", "trip": "", "name_th": "วราลี มาสสาจ", "addr_th": "ถนนศิริมังคลาจารย์ ต.สุเทพ อ.เมืองเชียงใหม่ จ.เชียงใหม่ 50200", "near_th": "ถนนศิริมังคลาจารย์ ใกล้นิมมาน", "gmap": "https://www.google.com/maps/search/?api=1&query=Varalee%20Massage%20%28Sirimangkalajarn%29%20Sirimangkalajarn%20Rd%2C%20Su%20Thep%2C%20Mueang%20Chiang%20Mai%2050200&hl=en", "gmap_th": "https://www.google.com/maps/search/?api=1&query=Varalee%20Massage%20%28Sirimangkalajarn%29%20Sirimangkalajarn%20Rd%2C%20Su%20Thep%2C%20Mueang%20Chiang%20Mai%2050200&hl=th"}, {"id": "baanhom", "name": "Baan Hom Samunphrai", "zh": "Baan Hom 草藥健康中心", "area": "郊區", "tier": "中價", "addr": "93/2a Moo 12 Tawangtan, Saraphi, Chiang Mai 50140", "hours": "請電話預約", "price": "全身2小時約1,000銖、腳底1小時約600銖、草藥蒸浴+200銖", "phone": "053-817-362 / 081-885-1429", "klook": "", "lat": 18.735, "lng": 99.012, "desc": "傳統泰醫按摩學校兼草藥中心，有草藥蒸氣浴；在市區南方約9公里，可電話叫車接送（約200銖）。適合想要深度體驗、願意專程去的人。", "trip": "", "name_th": "บ้านหอมสมุนไพร", "addr_th": "93/2ก หมู่ 12 ต.ท่าวังตาล อ.สารภี จ.เชียงใหม่ 50140", "near_th": "อ.สารภี ใกล้สถาบันแมคเคน", "gmap": "https://www.google.com/maps/search/?api=1&query=Baan%20Hom%20Samunphrai%2093/2a%20Moo%2012%20Tawangtan%2C%20Saraphi%2C%20Chiang%20Mai%2050140&hl=en", "gmap_th": "https://www.google.com/maps/search/?api=1&query=Baan%20Hom%20Samunphrai%2093/2a%20Moo%2012%20Tawangtan%2C%20Saraphi%2C%20Chiang%20Mai%2050140&hl=th"}, {"id": "dheva", "name": "Dheva Spa (Dhara Dhevi)", "zh": "Dheva Spa（Dhara Dhevi 度假村）", "area": "郊區", "tier": "高價", "addr": "51/4 Chiang Mai-Sankampaeng Rd, Moo 1, Tha Sala, Mueang Chiang Mai 50000", "hours": "約10:00-22:00（以官網為準）", "price": "頂級療程數千銖起；Sense 健康俱樂部約600銖起", "phone": "", "klook": "", "lat": 18.7838, "lng": 99.037, "desc": "清邁最奢華的度假村SPA之一，3,100平方公尺、18間療程套房，有Watsu水療池；往博桑紙傘村的路上（Day7可順路）。", "trip": "Day7 11/17 往博桑路上，可當奢華選項", "name_th": "เทวา สปา (ดาราเทวี)", "addr_th": "51/4 ถนนเชียงใหม่-สันกำแพง หมู่ 1 ต.ท่าศาลา อ.เมืองเชียงใหม่ จ.เชียงใหม่ 50000", "near_th": "โรงแรมดาราเทวี ถนนเชียงใหม่-สันกำแพง", "gmap": "https://www.google.com/maps/search/?api=1&query=Dheva%20Spa%20%28Dhara%20Dhevi%29%2051/4%20Chiang%20Mai-Sankampaeng%20Rd%2C%20Moo%201%2C%20Tha%20Sala%2C%20Mueang%20Chiang%20Mai%2050000&hl=en", "gmap_th": "https://www.google.com/maps/search/?api=1&query=Dheva%20Spa%20%28Dhara%20Dhevi%29%2051/4%20Chiang%20Mai-Sankampaeng%20Rd%2C%20Moo%201%2C%20Tha%20Sala%2C%20Mueang%20Chiang%20Mai%2050000&hl=th"}];
const HOME = {lat:18.783861, lng:99.002111, name:'🏠 民宿（長康路夜市旁）'};
const TIER_COLOR = {'平價':'var(--t1)','中價':'var(--t2)','中價連鎖':'var(--t2)','中高價':'var(--t3)','高價':'var(--t4)'};
const TIER_HEX = {'平價':'#2e8b57','中價':'#3a7bd5','中價連鎖':'#3a7bd5','中高價':'#8e44ad','高價':'#c8553d'};
const AREAS = ['全部','夜市/長康路','古城','古城南/Wualai','寧曼','濱江區','郊區','清萊'];
const TIERS = ['全部價位','平價','中價連鎖','中高價','高價'];
let area='全部', tier='全部價位', selected=null;
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
SHOPS.forEach((s,i)=> s.n = i+1);

document.getElementById('legend').innerHTML =
  [['平價','#2e8b57'],['中價','#3a7bd5'],['中高價','#8e44ad'],['高價','#c8553d']].map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join('') +
  '<span>⬛ 民宿</span>';

function chips(id, opts, get, set){
  const el = document.getElementById(id);
  el.innerHTML = opts.map(o=>`<button class="chip ${o===get()?'on':''}" data-v="${o}">${o}</button>`).join('');
  el.onclick = e => { const v = e.target.dataset.v; if(!v) return; set(v); render(); };
}

let map = null, layer = null;
const markers = {};
if (window.L) {
  map = L.map('map', {scrollWheelZoom:true}).setView([HOME.lat, HOME.lng], 14);
  // Esri World Street Map：免金鑰，泰國街道與地名以英文顯示
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles &copy; Esri'}).addTo(map);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'});
  L.control.layers({'英文街名（Esri）': esri, '泰文街名（OpenStreetMap）': osm}).addTo(map);
  L.marker([HOME.lat, HOME.lng], {icon: L.divIcon({className:'', html:'<div class="pin" style="background:#222"><span>🏠</span></div>', iconSize:[26,26], iconAnchor:[13,26]})})
    .addTo(map).bindPopup('<b>'+HOME.name+'</b><br>住宿位置（概略）');
  layer = L.layerGroup().addTo(map);
} else {
  document.getElementById('map').innerHTML = '<p style="padding:16px">地圖載入失敗（需要網路），仍可使用右側清單的 Google 地圖連結。</p>';
}

function popup(s){
  return `<b>${s.n}. ${esc(s.zh)}</b><br><span style="color:#888">${esc(s.name)}</span><br>${esc(s.price)}<br>${esc(s.hours)}<br>
    <a href="#" onclick="openDriver('${s.id}');return false;">🛺 給司機看</a> · <a href="${esc(s.gmap)}" target="_blank" rel="noopener">📍 Google 地圖</a>${s.klook?` · <a href="${esc(s.klook)}" target="_blank" rel="noopener">🎫 Klook</a>`:''}`;
}

function render(){
  chips('areaF', AREAS, ()=>area, v=>area=v);
  chips('tierF', TIERS, ()=>tier, v=>tier=v);
  const vis = SHOPS.filter(s => (area==='全部'||s.area===area) && (tier==='全部價位'||s.tier===tier||(tier==='中價連鎖'&&s.tier==='中價')));
  document.getElementById('list').innerHTML = vis.map(s=>`
    <div class="card ${selected===s.id?'sel':''}" data-id="${s.id}">
      <h3><span class="num" style="background:${TIER_COLOR[s.tier]}">${s.n}</span>${esc(s.zh)}</h3>
      <p class="en">${esc(s.name)}</p>
      <div class="meta"><span class="tag">${esc(s.area)}</span><span class="tag">${esc(s.tier)}</span><br>
        💰 ${esc(s.price)}<br>🕒 ${esc(s.hours)}<br>📫 ${esc(s.addr)}${s.phone?`<br>☎️ ${esc(s.phone)}`:''}<br>${esc(s.desc)}</div>
      ${s.trip?`<div class="trip">🗓️ ${esc(s.trip)}</div>`:''}
      <div class="links"><button class="drv" data-drv="${s.id}">🛺 給司機看（泰文）</button><a href="${esc(s.gmap)}" target="_blank" rel="noopener">📍 Google 地圖</a>${s.klook?`<a href="${esc(s.klook)}" target="_blank" rel="noopener">🎫 Klook 預約</a>`:''}</div>
    </div>`).join('') || '<p class="sub">沒有符合條件的店家</p>';
  document.querySelectorAll('.card').forEach(c => c.onclick = e => { if(e.target.dataset.drv){ openDriver(e.target.dataset.drv); return; } if(e.target.tagName==='A') return; focus(c.dataset.id); });
  if (!map) return;
  layer.clearLayers();
  vis.forEach(s => {
    const m = L.marker([s.lat, s.lng], {icon: L.divIcon({className:'', html:`<div class="pin" style="background:${TIER_HEX[s.tier]}"><span>${s.n}</span></div>`, iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24]})}).bindPopup(popup(s));
    m.on('click', ()=>{ selected = s.id; highlight(); });
    markers[s.id] = m; layer.addLayer(m);
  });
  // 「全部」時只框清邁市區（清萊相距約180公里、郊區店家會把地圖縮太小）
  const fit = area==='全部' ? vis.filter(s=>s.area!=='清萊' && s.area!=='郊區') : vis;
  const pts = (fit.length ? fit : vis).map(s=>[s.lat,s.lng]).concat(area==='清萊'?[]:[[HOME.lat,HOME.lng]]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), {padding:[30,30], maxZoom:16});
}
function highlight(){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel', c.dataset.id===selected));
  const c = document.querySelector(`.card[data-id="${selected}"]`); if (c) c.scrollIntoView({block:'nearest', behavior:'smooth'});
}
let view = 'all';
function gembed(s){
  return 'https://maps.google.com/maps?q=' + encodeURIComponent(s.name + ' ' + s.addr.replace(/（[^）]*）/g,'')) + '&hl=en&z=17&output=embed';
}
function showGoogle(){
  const s = SHOPS.find(x=>x.id===selected) || SHOPS[0];
  if (!selected) { selected = s.id; highlight(); }
  const g = document.getElementById('gmap');
  const src = gembed(s);
  if (g.dataset.src !== src) { g.src = src; g.dataset.src = src; }
  document.getElementById('gnote').textContent = 'Google 地圖（英文）：' + s.zh;
}
function setView(v){
  view = v;
  document.querySelectorAll('#views .chip').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  document.getElementById('map').style.display = v==='all' ? '' : 'none';
  document.getElementById('gmap').style.display = v==='google' ? 'block' : 'none';
  if (v==='google') showGoogle();
  else { document.getElementById('gnote').textContent = '點清單或標記，切到 Google 地圖看該店周邊'; if (map) map.invalidateSize(); }
}
document.getElementById('views').onclick = e => { const v = e.target.dataset.view; if (v) setView(v); };
function focus(id){
  selected = id; highlight();
  if (view==='google') { showGoogle(); return; }
  const s = SHOPS.find(x=>x.id===id);
  if (map && markers[id]) { map.setView([s.lat, s.lng], 16); markers[id].openPopup(); }
}
function openDriver(id){
  const s = SHOPS.find(x=>x.id===id); if(!s) return;
  document.getElementById('dName').textContent = s.name_th;
  document.getElementById('dNear').textContent = '📍 ' + s.near_th;
  document.getElementById('dAddr').textContent = s.addr_th;
  document.getElementById('dZh').textContent = s.zh + '｜' + s.name;
  const q = encodeURIComponent(s.name + ' ' + s.addr.replace(/（[^）]*）/g,''));
  document.getElementById('dMap').src = 'https://maps.google.com/maps?q=' + q + '&hl=th&z=17&output=embed';
  document.getElementById('dOpen').href = s.gmap_th;
  document.getElementById('driver').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDriver(){
  document.getElementById('driver').classList.remove('open');
  document.getElementById('dMap').src = 'about:blank';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDriver(); });
render();
</script>
</body>
